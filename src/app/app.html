<header class="topbar">
  <div class="container bar">
    <a routerLink="/products" class="brand">🛍️ Loja<span>Ng</span></a>
    <nav>
      @if (auth.user(); as user) {
        <span class="user muted">Olá, {{ user.name }}</span>
        <button class="btn ghost" type="button" (click)="logout()">Sair</button>
      } @else {
        <a routerLink="/login" class="btn ghost">Entrar</a>
      }
      <button class="btn cart-btn" type="button" (click)="cart.drawerOpen.set(true)" aria-label="Abrir carrinho">
        🛒 Carrinho
        @if (cart.totalItems() > 0) {
          <span class="badge">{{ cart.totalItems() }}</span>
        }
      </button>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="container muted foot">Projeto de portfólio · Angular 22 · dados fictícios</footer>

<app-cart-drawer />
